  // 日程
  addSch: () => schForm(null),
  editSch: el => { const s = findSch(el.dataset.id); if (s) schForm(s); },
  delSch: el => { const s = findSch(el.dataset.id); if (!s) return; DB.schedule = DB.schedule.filter(x => x.id !== s.id); save(); render(); toast('已删除'); },
  toggleSch: el => { const s = findSch(el.dataset.id); if (!s) return; s.done = !s.done; save(); render(); },
  planFilter: el => { S.planFilter = el.dataset.v; render(); },
  // 待买
  addShop: () => shopForm(null),
  editShop: el => { const s = findShop(el.dataset.id); if (s) shopForm(s); },
  delShop: el => { const s = findShop(el.dataset.id); if (!s) return; DB.shopping = DB.shopping.filter(x => x.id !== s.id); save(); render(); toast('已删除'); },
  toggleShop: el => { const s = findShop(el.dataset.id); if (!s) return; s.bought = !s.bought; save(); render(); },
  toggleBoughtView: () => { S.shopShowBought = !S.shopShowBought; render(); },
  clearBought: () => confirmBox('清空已购', '删除全部已购条目？此操作不可撤销。', '删除', () => { DB.shopping = DB.shopping.filter(x => !x.bought); save(); render(); toast('已清空'); }),
  shopToMoney: el => {
    const s = findShop(el.dataset.id); if (!s) return;
    DB.money.push({ id: uid(), date: today(), type: 'expense', amount: Number(s.price) || 0, cat: '购物', note: s.name });
    s.bought = true;
    commit(); render(); toast('已记为购物支出 ' + money(s.price || 0));
  },
  // 收藏
  addMedia: () => mediaForm(null),
  editMedia: el => { const m = findMedia(el.dataset.id); if (m) mediaForm(m); },
  delMedia: el => { const m = findMedia(el.dataset.id); if (!m) return; DB.media = DB.media.filter(x => x.id !== m.id); save(); render(); toast('已删除'); },
  mediaView: el => { S.mediaView = el.dataset.v; render(); },
  mediaFilter: el => { S.mediaFilter = el.dataset.v; render(); }
};

/* ==========================================================
   18. 事件绑定与启动
   ========================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (el.tagName === 'SELECT' || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
  if (el.tagName === 'BUTTON' && el.type === 'button' && !ACTIONS[act]) return;
  if (!ACTIONS[act]) return;
  if (el.tagName === 'BUTTON' && el.disabled) return;
  e.preventDefault();
  try { ACTIONS[act](el); } catch (err) { console.error(err); toast('操作出错：' + err.message); }
}, false);

document.addEventListener('change', e => {
  const t = e.target;
  if (!t) return;
  if (t.id === 'impFile') {
    const f = t.files && t.files[0];
    if (f) importJSON(f);
    t.value = '';
    return;
  }
  if (t.dataset && t.dataset.pk) {
    const k = t.dataset.pk, raw = String(t.value).trim();
    if (k === 'goalFrom' || k === 'goalTo') DB.meta[k] = raw === '' ? null : Number(raw);
    else if (['height', 'tdee', 'budget'].indexOf(k) >= 0) DB.meta[k] = raw === '' ? 0 : Number(raw);
    save(true); render(); return;
  }
  const el = t.closest ? t.closest('[data-act]') : null;
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'mMonthSel') { S.mMonth = el.value; S.mCat = 'all'; render(); return; }
  if (act === 'hNum') {
    const h = findHabit(el.dataset.id); if (!h) return;
    const raw = String(el.value).trim();
    if (raw === '') { setHabit(h, today(), null); }
    else {
      const n = Number(raw);
      if (!isFinite(n) || n < 0) { toast('请输入有效数字'); render(); return; }
      setHabit(h, today(), Math.round(n * 10) / 10);
    }
    commit(); render(); return;
  }
  if (act === 'saveIntake') {
    const raw = String(el.value).trim();
    const d = today();
    DB.intake = DB.intake.filter(x => x.date !== d);
    if (raw !== '' && isFinite(Number(raw)) && Number(raw) >= 0) DB.intake.push({ id: uid(), date: d, kcal: Math.round(Number(raw)) });
    commit(); render(); return;
  }
}, false);

document.addEventListener('input', e => {
  const t = e.target;
  if (!t) return;
  if (t.dataset && t.dataset.pk === 'nick') {
    DB.meta.nick = String(t.value).slice(0, 16);
    save(true);
    return;
  }
  const el = t.closest ? t.closest('[data-act]') : null;
  if (!el) return;
  if (el.dataset.act === 'mSearch') {
    S.mSearch = el.value;
    const pos = el.selectionStart;
    render();
    const again = $('[data-act="mSearch"]');
    if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (err) { } }
  }
}, false);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#modal').hidden) closeModal(); return; }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
    if (!$('#modal').hidden && modalSubmit) { e.preventDefault(); modalSubmit(); }
  }
}, false);

$('#modal').addEventListener('click', e => {
  if (e.target.classList.contains('modal-bg')) closeModal();
});

window.addEventListener('beforeunload', () => { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { } });

function init() {
  load();
  if (corruptRaw) {
    banner('corrupt', 'bad', '本地数据已损坏，无法读取',
      '浏览器里保存的数据格式异常，可能是写入过程中被中断。你可以先把原始内容导出保存，再选择恢复方式。',
      [{ t: '导出损坏的原始数据', a: 'dumpRaw' }, { t: '重置为空白工作台', a: 'resetCorrupt' }]);
    ACTIONS.dumpRaw = () => { download(corruptRaw, '损坏数据_' + today() + '.txt', 'text/plain;charset=utf-8'); toast('原始数据已导出'); };
    ACTIONS.resetCorrupt = () => confirmBox('重置数据', '将丢弃损坏内容并以空白工作台启动。如果刚才已导出原始数据，之后可手动修复再导入。', '确认重置', () => {
      corruptRaw = null; clearBanner('corrupt'); DB = BLANK(); save(true); render(); toast('已重置');
    });
  } else if (!storageOK) {
    banner('storage', 'bad', '浏览器禁止了本地存储',
      '当前环境（可能是无痕模式或隐私设置）无法保存数据，关闭页面后内容会丢失。可以正常使用，但请随时导出 JSON 备份。',
      [{ t: '导出备份', a: 'exportJSON' }]);
  } else {
    const empty = !DB.money.length && !DB.habits.length && !DB.media.length && !DB.schedule.length && !DB.shopping.length && !DB.weights.length && !DB.intake.length;
    if (empty) {
      seedDemo();
      banner('demo', 'info', '先给你放了一份演示数据',
        '这里预置了少量示例记账、习惯、体重与收藏，方便你快速了解各个模块。随时可以在「数据与设置」里一键清空。',
        [{ t: '清空演示数据', a: 'clearDemo' }, { t: '保留并开始', a: 'dismissDemo' }]);
    } else if (DB.meta.sinceBackup >= 20) {
      banner('backup', 'warn', '已新增 ' + DB.meta.sinceBackup + ' 条记录，建议备份',
        '数据只存在这台设备的浏览器里，导出一份 JSON 更稳妥。',
        [{ t: '立即导出 JSON', a: 'exportJSON' }, { t: '稍后再说', a: 'snoozeBackup' }]);
    }
  }
  paintStorage();
  render();
  setTimeout(() => { try { paintStorage(); } catch (e) { } }, 400);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
</html>
