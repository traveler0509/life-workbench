          const d = addDays(weekRange(t).from, (c.dow + 6) % 7);
          const list = workoutsOf(d);

          const vol = list.reduce((a, b) => a + volOf(b), 0);
          return '<div class="wk-cell' + (isT ? ' now' : '') + (list.length ? '' : rest ? ' rest' : '') + '">' +
            '<div class="dw">周' + WD[c.dow] + '</div>' +

              ? '<div class="mk">' + list.length + '</div><div class="tx">' + (vol ? (vol >= 1000 ? (vol / 1000).toFixed(1) + ' t' : Math.round(vol) + ' kg') : nf(list.reduce((a, b) => a + (Number(b.kcal) || 0), 0)) + ' kcal') + '</div>'
              : '<div class="mk ph">—</div><div class="tx">' + (rest ? '休息' : '未练') + '</div>') +

        '<div style="font-size:14px;color:var(--muted);margin-top:10px">上排为本周每日实际训练条数与容量 / 消耗，与上面的计划对照看。</div>';
      })() + '</div>' +
    '</div>' +

    '<div class="sec"><div class="sec-hd"><h2>称重记录</h2><span class="note">' + DB.weights.length + ' 条</span></div>' +
      (DB.weights.length ? '<div class="panel">' + DB.weights.slice().reverse().slice(0, 40).map((w, i, arr) => {
        const prev = arr[i + 1];
        const d = prev ? w.weight - prev.weight : null;
        const b = bmiOf(w.weight);
        return '<div class="tx"><span class="ic" style="background:var(--paper-3);color:var(--ink-3)">' + (b != null ? b.toFixed(1) : '–') + '</span>' +

          (d != null && Math.abs(d) > 0.001 ? '<span class="am ' + (d < 0 ? 'pos' : 'neg') + '" style="font-size:14px">' + (d > 0 ? '+' : '') + d.toFixed(1) + '</span>' : '') +
          '<button class="icon-btn danger" data-act="delWeight" data-id="' + w.id + '">' + ic('trash') + '</button></div>';
      }).join('') + '</div>' : '<div class="empty">还没有称重记录</div>') +

};

VIEWS.shop = function () {
  const st = shopStats();
  const pending = st.pend, bought = st.bought, total = st.pendSum;
  const byPri = { '高': [], '中': [], '低': [] };
  pending.forEach(x => { (byPri[x.pri] || byPri['中']).push(x); });
  const priTag = p => p === '高' ? 'a' : p === '中' ? 'y' : '';
  const rowHTML = x => '<div class="shop">' +
    '<button class="cb ' + (x.bought ? 'on' : '') + '" data-act="toggleShop" data-id="' + x.id + '" title="切换已购">' + ic('check') + '</button>' +
    '<span class="nm ' + (x.bought ? 'done' : '') + '">' + esc(x.name) + (x.cat ? ' <span style="font-size:13.5px;color:var(--faint)">' + esc(x.cat) + '</span>' : '') + '</span>' +
    (x.pri !== '中' ? '<span class="tag ' + priTag(x.pri) + '">' + x.pri + '</span>' : '') +
    '<span class="pr">' + (x.price ? money(x.price) : '—') + '</span>' +
    '<button class="icon-btn" data-act="editShop" data-id="' + x.id + '">' + ic('edit') + '</button>' +
    '<button class="icon-btn danger" data-act="delShop" data-id="' + x.id + '">' + ic('trash') + '</button>' +
    '</div>';

  return '' +
    '<div class="eyebrow">Wishlist · 待买清单</div>' +
    '<h1 class="page-t">想买的东西，<em>先放一放</em></h1>' +
    '<p class="sub">列出来、放两天，很多冲动会自己消失。勾选即归档，方便回看这个月买了什么。</p>' +

    '<div class="sec">' + statStrip([
      { l: '待买件数', v: pending.length, u: ' 件', sub: pending.length ? '高优先级 ' + byPri['高'].length + ' 件' : '清单是空的' },
      { l: '待买合计', v: money(st.pendSum), sub: pending.length ? '平均 ' + money(st.pendSum / pending.length) + ' / 件' : '预估支出为 0' },
      { l: '已入手', v: bought.length, u: ' 件', sub: bought.length ? '共花 ' + money(st.boughtSum) : '还没有入手记录' },
      { l: '清单总量', v: DB.shopping.length, u: ' 条', sub: '含已入手归档' }
    ]) +
    (st.cats.length > 1 ? '<div class="chips" style="margin-top:12px">' +
      st.cats.map(c => '<span class="chip" style="cursor:default">' + esc(c.name) + ' · ' + c.n + '</span>').join('') + '</div>' : '') +
    '</div>' +

    '<div class="sec"><div class="sec-hd"><h2>待买</h2><span class="note">' + pending.length + ' 件 · 合计 ' + money(total) + '</span>' +
      '<span class="spacer"></span>' +
      (bought.length ? '<button class="btn ghost mini" data-act="toggleBoughtView">' + (S.shopShowBought ? '隐藏已购' : '显示已购 ' + bought.length) + '</button>' : '') +
      '<button class="btn accent mini" style="margin-left:8px" data-act="addShop">' + ic('plus') + '添加</button></div>' +
      (pending.length ? '<div class="panel">' +
        ['高', '中', '低'].filter(p => byPri[p].length).map(p =>
          '<div style="margin-bottom:14px"><div style="font-size:13.5px;letter-spacing:.14em;color:var(--faint);margin-bottom:4px">' + p + '优先级</div>' +
          byPri[p].map(rowHTML).join('') + '</div>').join('') +

    (bought.length && S.shopShowBought ? '<div class="sec"><div class="sec-hd"><h2>已购</h2><span class="note">' + bought.length + ' 件 · 共花 ' + money(bought.reduce((a, b) => a + (Number(b.price) || 0), 0)) + '</span>' +

const MEDIA_TYPE = { book: { n: '书', i: 'book' }, movie: { n: '影', i: 'spark' }, music: { n: '音', i: 'heart' } };
const MEDIA_STATUS = { want: '想看', doing: '在看', done: '看完' };
const hashStr = s => { let h = 0; for (let i = 0; i < String(s).length; i++) h = (h * 31 + String(s).charCodeAt(i)) >>> 0; return h; };
function mediaGradient(m) {
  const h = hashStr(m.title + m.creator);
  const c1 = PALETTE[h % PALETTE.length], c2 = PALETTE[(h >>> 4) % PALETTE.length];
  return 'linear-gradient(145deg,' + c1 + ',' + c2 + ')';
}
function starStr(n) { let s = ''; for (let i = 1; i <= 5; i++) s += (i <= n ? '★' : '☆'); return s; }

VIEWS.media = function () {
  const f = S.mediaFilter;
  let list = DB.media.slice();
  if (f !== 'all') list = list.filter(x => x.type === f);
  list.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const wall = S.mediaView === 'wall';

  // 年度统计
  const years = mediaYears();
  const year = String(S.mediaYear || new Date().getFullYear());
  const ys = mediaYearStats(year);
  const yList = ys.list;
  const top = ys.list.filter(x => x.rating > 0).sort((a, b) => b.rating - a.rating)[0];

  const cardHTML = x => {
    const st = x.status === 'done' ? '已看完' : x.status === 'doing' ? '在看' : '想看';
    return '<div class="cover" data-act="editMedia" data-id="' + x.id + '">' +
      (x.cover ? '<img src="' + esc(x.cover) + '" alt="" loading="lazy">' : '') +
      (x.cover ? '' : '<div class="ph" style="background:' + mediaGradient(x) + '">' +
        '<div><div class="t">' + esc(x.title) + '</div><div class="c">' + esc(x.creator || '') + '</div></div></div>') +
      '<div class="ov"></div>' +
      '<span class="bdg">' + st + '</span>' +
      (x.rating ? '<span class="stars">' + starStr(x.rating) + '</span>' : '') +
      '</div>';
  };
  const listHTML = x => '<div class="mlist">' +
    '<div class="th" style="background:' + (x.cover ? 'transparent' : mediaGradient(x)) + '">' +
      (x.cover ? '<img src="' + esc(x.cover) + '" alt="">' : esc(x.title.slice(0, 1))) + '</div>' +
    '<div class="bd"><b>' + esc(x.title) + '</b>' +
      '<div class="meta">' + MEDIA_TYPE[x.type].n + ' · ' + esc(x.creator || '未知') + (x.year ? ' · ' + esc(x.year) : '') + ' · ' +
      '<span style="color:var(--accent)">' + starStr(x.rating) + '</span> · ' + MEDIA_STATUS[x.status] + ' · ' + esc(x.date || '') + '</div>' +
      (x.review ? '<div class="rv">' + esc(x.review) + '</div>' : '') +
    '</div>' +
    '<button class="icon-btn" data-act="editMedia" data-id="' + x.id + '">' + ic('edit') + '</button>' +
    '<button class="icon-btn danger" data-act="delMedia" data-id="' + x.id + '">' + ic('trash') + '</button>' +
    '</div>';

  return '' +
    '<div class="eyebrow">Library · 书影音收藏</div>' +
    '<h1 class="page-t">今年读过的、看过的、<em>听过的</em></h1>' +
    '<p class="sub">状态、星级、短评，随手记一句，年底回看会很有意思。</p>' +

    '<div class="sec"><div class="sec-hd"><h2>' + year + ' 年小结</h2><span class="spacer"></span>' +
      (years.length > 1 ? '<select class="inp" style="max-width:104px;margin-right:8px" data-act="mediaYear">' +
        years.map(y => '<option value="' + y + '"' + (y === year ? ' selected' : '') + '>' + y + ' 年</option>').join('') + '</select>' : '') +
      '<button class="btn accent mini" data-act="addMedia">' + ic('plus') + '添加收藏</button></div>' +
      (ys.list.length ? statStrip([
        { l: '新增收藏', v: ys.list.length, u: ' 条', sub: '书 ' + ys.tc.book + ' · 影 ' + ys.tc.movie + ' · 音 ' + ys.tc.music },
        { l: '已完成', v: ys.done, u: ' 条', sub: '在看 ' + ys.doing + ' · 想看 ' + ys.want },
        { l: '平均评分', v: ys.avg ? ys.avg.toFixed(1) : '—', u: ys.avg ? ' 星' : '', sub: '已评分 ' + ys.rated + ' 条' },
        { l: '写了短评', v: ys.reviewed, u: ' 条', sub: '占 ' + Math.round(ys.reviewed / ys.list.length * 100) + '%' }
      ]) +
      '<div class="panel flat" style="margin-top:14px;display:flex;gap:22px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-3);align-items:center">' +
        ['book', 'movie', 'music'].map(k => {
          const n = ys.tc[k], pct = ys.list.length ? Math.round(n / ys.list.length * 100) : 0;
          return '<span style="display:flex;align-items:center;gap:7px"><span class="tag ' + (k === 'book' ? 'b' : k === 'movie' ? 'a' : 'p') + '">' + MEDIA_TYPE[k].n + '</span>' +
            '<span class="num" style="font-size:14px">' + n + '</span><span class="mute" style="font-size:13.5px">' + pct + '%</span></span>';
        }).join('') +
        '<span style="flex:1;min-width:20px"></span>' +
        (top ? '<span class="mute">最高分 <b style="font-weight:500;color:var(--ink-2)">' + esc(top.title) + '</b> <span style="color:#E0A93B">' + starStr(top.rating) + '</span></span>' : '') +
      '</div>'
        : '<div class="empty">' + year + ' 年还没有收藏记录</div>') +
    '</div>' +

    '<div class="sec"><div class="sec-hd"><h2>收藏</h2><span class="note">' + list.length + ' 条</span><span class="spacer"></span>' +
      '<div class="seg" style="margin-right:8px">' +
        [['all', '全部'], ['book', '书'], ['movie', '影'], ['music', '音']].map(x =>
          '<button class="' + (f === x[0] ? 'on' : '') + '" data-act="mediaFilter" data-v="' + x[0] + '">' + x[1] + '</button>').join('') +
      '</div>' +
      '<div class="seg">' +
        '<button class="' + (wall ? 'on' : '') + '" data-act="mediaView" data-v="wall">' + ic('grid') + '</button>' +
        '<button class="' + (!wall ? 'on' : '') + '" data-act="mediaView" data-v="list">' + ic('list') + '</button>' +
      '</div></div>' +
      (list.length ? (wall ? '<div class="wall">' + list.map(cardHTML).join('') + '</div>' : '<div class="panel">' + list.map(listHTML).join('') + '</div>')
        : '<div class="empty">这里还空着。加一本最近想读的书试试。</div>') +
    '</div>';
};

/* ==========================================================
   18. 事件绑定与启动
   ========================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (el.tagName === 'SELECT' || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
  if (el.tagName === 'BUTTON' && el.type === 'button' && !ACTIONS[act]) return;
  if (!ACTIONS[act]) return;
  if (el.tagName === 'BUTTON' && el.disabled) return;
  e.preventDefault();
  try { ACTIONS[act](el); } catch (err) { console.error(err); toast('操作出错：' + err.message); }
}, false);

document.addEventListener('change', e => {
  const t = e.target;
  if (!t) return;
  if (t.id === 'impFile') {
    const f = t.files && t.files[0];
    if (f) importJSON(f);
    t.value = '';
    return;
  }
  if (t.dataset && t.dataset.pk) {
    const k = t.dataset.pk, raw = String(t.value).trim();
    if (k === 'goalFrom' || k === 'goalTo') DB.meta[k] = raw === '' ? null : Number(raw);
    else if (['height', 'tdee'].indexOf(k) >= 0) DB.meta[k] = raw === '' ? 0 : Number(raw);
    save(true); render(); return;
  }
  const el = t.closest ? t.closest('[data-act]') : null;
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'mMonthSel') { S.mMonth = el.value; S.mCat = 'all'; render(); return; }
  if (act === 'hNum') {
    const h = findHabit(el.dataset.id); if (!h) return;
    const raw = String(el.value).trim();
    if (raw === '') { setHabit(h, today(), null); }
    else {
      const n = Number(raw);
      if (!isFinite(n) || n < 0) { toast('请输入有效数字'); render(); return; }
      setHabit(h, today(), Math.round(n * 10) / 10);
    }
    commit(); render(); return;
  }
  if (act === 'mediaYear') { S.mediaYear = el.value; render(); return; }
  if (act === 'saveIntake') {
    const raw = String(el.value).trim();
    const d = today();
    DB.intake = DB.intake.filter(x => x.date !== d);
    if (raw !== '' && isFinite(Number(raw)) && Number(raw) >= 0) DB.intake.push({ id: uid(), date: d, kcal: Math.round(Number(raw)) });
    commit(); render(); return;
  }
  if (act === 'saveBurn') {
    const raw = String(el.value).trim();
    const d = today();
    if (raw === '' || !isFinite(Number(raw)) || Number(raw) < 0) { render(); return; }
    const k = Math.round(Number(raw));
    const ws = workoutsOf(d);
    if (!ws.length) {
      /* 没有训练记录时，补一条纯消耗条目，让数据有落点 */
      DB.workouts.push({ id: uid(), date: d, spot: '有氧', name: '运动消耗', sets: 0, reps: 0, weight: 0, dur: 0, kcal: k });
    } else {
      /* 把差额记在当日首条上，其余清零，避免重复累加 */
      const base = ws.reduce((a, b) => a + (Number(b.kcal) || 0), 0);
      ws.forEach(x => { if (!x.est) x.kcal = 0; });
      ws[0].kcal = k;
    }
    DB.workouts.sort((a, b) => a.date < b.date ? -1 : 1);
    commit(); render(); return;
  }
}, false);

document.addEventListener('input', e => {
  const t = e.target;
  if (!t) return;
  if (t.dataset && t.dataset.pk === 'nick') {
    DB.meta.nick = String(t.value).slice(0, 16);
    save(true);
    return;
  }
  const el = t.closest ? t.closest('[data-act]') : null;
  if (!el) return;
  if (el.dataset.act === 'mSearch') {
    S.mSearch = el.value;
    const pos = el.selectionStart;
    render();
    const again = $('[data-act="mSearch"]');
    if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (err) { } }
  }
}, false);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#modal').hidden) closeModal(); return; }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
    if (!$('#modal').hidden && modalSubmit) { e.preventDefault(); modalSubmit(); }
  }
}, false);

$('#modal').addEventListener('click', e => {
  if (e.target.classList.contains('modal-bg')) closeModal();
});

window.addEventListener('beforeunload', () => { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { } });

function init() {
  load();
  if (corruptRaw) {
    banner('corrupt', 'bad', '本地数据已损坏，无法读取',
      '浏览器里保存的数据格式异常，可能是写入过程中被中断。你可以先把原始内容导出保存，再选择恢复方式。',
      [{ t: '导出损坏的原始数据', a: 'dumpRaw' }, { t: '重置为空白工作台', a: 'resetCorrupt' }]);
    ACTIONS.dumpRaw = () => { download(corruptRaw, '损坏数据_' + today() + '.txt', 'text/plain;charset=utf-8'); toast('原始数据已导出'); };
    ACTIONS.resetCorrupt = () => confirmBox('重置数据', '将丢弃损坏内容并以空白工作台启动。如果刚才已导出原始数据，之后可手动修复再导入。', '确认重置', () => {
      corruptRaw = null; clearBanner('corrupt'); DB = BLANK(); save(true); render(); toast('已重置');
    });
  } else if (!storageOK) {
    banner('storage', 'bad', '浏览器禁止了本地存储',
      '当前环境（可能是无痕模式或隐私设置）无法保存数据，关闭页面后内容会丢失。可以正常使用，但请随时导出 JSON 备份。',
      [{ t: '导出备份', a: 'exportJSON' }]);
  } else {
    const empty = !DB.money.length && !DB.habits.length && !DB.media.length && !DB.schedule.length && !DB.shopping.length && !DB.weights.length && !DB.intake.length && !DB.workouts.length;
    if (empty) {
      seedDemo();
      banner('demo', 'info', '先给你放了一份演示数据',
        '这里预置了少量示例习惯、体重、待买与收藏，方便你快速了解各个模块。随时可以在「数据与设置」里一键清空。',
        [{ t: '清空演示数据', a: 'clearDemo' }, { t: '保留并开始', a: 'dismissDemo' }]);
    } else if (DB.meta.sinceBackup >= 20) {
      banner('backup', 'warn', '已新增 ' + DB.meta.sinceBackup + ' 条记录，建议备份',
        '数据只存在这台设备的浏览器里，导出一份 JSON 更稳妥。',
        [{ t: '立即导出 JSON', a: 'exportJSON' }, { t: '稍后再说', a: 'snoozeBackup' }]);
    }
  }
  paintStorage();
  render();
  setTimeout(() => { try { paintStorage(); } catch (e) { } }, 400);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
</html>
